name: Kafka-Zookeeper Docker Setup

on:
  push:
    branches:
      - main

jobs:
  kafka-zookeeper-setup:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Docker
      uses: docker/setup-buildx-action@v2

    - name: Run Docker Compose to Start Zookeeper and Kafka
      run: |
        docker-compose -f docker-compose.yml up -d
        sleep 30  # Give it a little time to initialize

    - name: Get Docker Container IDs for Zookeeper and Kafka
      run: |
        echo "Zookeeper container ID:"
        docker ps -q --filter "ancestor=zookeeper"
        echo "Kafka container ID:"
        docker ps -q --filter "ancestor=kafka"

    - name: Check Zookeeper logs
      run: |
        ZOOKEEPER_CONTAINER_ID=$(docker ps -q --filter "ancestor=zookeeper")
        docker logs $ZOOKEEPER_CONTAINER_ID

    - name: Check Kafka logs
      run: |
        KAFKA_CONTAINER_ID=$(docker ps -q --filter "ancestor=kafka")
        docker logs $KAFKA_CONTAINER_ID

    - name: Clean up
      run: |
        docker-compose down
